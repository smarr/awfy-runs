report-completion:
  needs:
    [
      deltablue,
      richards,
      json,
      cd,
      havlak,
      bounce,
      list,
      mandelbrot,
      nbody,
      permute,
      queens,
      sieve,
      storage,
      towers,
    ]
  tags: [yuria3]
  script:
    - rebench --experiment="CI ID $CI_PIPELINE_ID" --report-completion codespeed.conf
