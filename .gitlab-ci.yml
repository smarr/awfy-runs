      # e:C++HJ-Clang
      # e:C++HJ-GCC
      # e:C++RK-Clang
      # e:C++RK-GCC
    )
  params-build: &PARAMS_BUILD export PARAMS="-d -v -f --setup-only --disable-data-reporting"
  params-run: &PARAMS_RUN export PARAMS="-f --without-building"

before_script:
  - git submodule update --init --recursive

build-y1:
  tags: [yuria]
  script:
    - *EXECUTORS
    - *PARAMS_BUILD
    - cp -r scripts ~/.local/
    - rebench $PARAMS codespeed.conf all "${EXECUTORS[@]}" s:*:List

build-y2:
  tags: [yuria2]
  script:
    - *EXECUTORS
    - *PARAMS_BUILD
    - cp -r scripts ~/.local/
    - rebench $PARAMS codespeed.conf all "${EXECUTORS[@]}" s:*:List

build-y3:
  tags: [yuria3]
  script:
    - *EXECUTORS
    - *PARAMS_BUILD
    - cp -r scripts ~/.local/
    - rebench $PARAMS codespeed.conf all "${EXECUTORS[@]}" s:*:List

deltablue:
  needs: ["build-y1"]
  tags: [yuria]
  script:
    - *EXECUTORS
    - *PARAMS_RUN
    - rebench $PARAMS --experiment="CI ID $CI_PIPELINE_ID" --branch="$CI_COMMIT_REF_NAME" codespeed.conf all "${EXECUTORS[@]}" s:*:DeltaBlue

