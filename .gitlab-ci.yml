      # e:CRuby-int
      # e:CRuby-y-jit
      # e:TruffleRuby-HotspotEE-jit
      # e:TruffleRuby-NativeEE-int

      # e:Lua53-int
      # e:Lua54-int
      # e:LuaJIT21-jit
      # e:LuaJIT21-int

      # e:Pharo
      # e:Squeak

      # e:C++-Clang-O3-lto-pgo-generic
      # e:C++-GCC-O3-lto-pgo-generic
