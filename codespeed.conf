executors:
    Java-native:
        path: awfy/benchmarks/Java
        executable: benchmarks
        build:
          - |
            export JAVA_HOME=/home/gitlab-runner/.asdf/installs/java/temurin-21.0.2+13.0.LTS
            export PATH=$PATH:/home/gitlab-runner/.asdf/installs/awfy/oracle-graalvm-21.0.2/bin
            ./build-native.sh

    Java-native-pgo:
        path: awfy/benchmarks/Java
        executable: benchmarks-pgo
        build:
          - |
            export JAVA_HOME=/home/gitlab-runner/.asdf/installs/java/temurin-21.0.2+13.0.LTS
            export PATH=$PATH:/home/gitlab-runner/.asdf/installs/awfy/oracle-graalvm-21.0.2/bin
            ./build-native.sh pgo

    Java-Temurin-22-int:
      path: /home/gitlab-runner/.asdf/installs
      executable: java/temurin-22.0.2+9/bin/java
      args: -Xint
      build:
        - /home/gitlab-runner/.asdf/bin/asdf install java temurin-22.0.2+9

    Java-Temurin-17-int:
      path: /home/gitlab-runner/.asdf/installs/java
      executable: temurin-17.0.10+7/bin/java
      args: -Xint

    Java-Temurin-8-int:
      path: /home/gitlab-runner/.asdf/installs/java/temurin-8.0.402+6/bin
      executable: java
      args: -Xint

    Java-Temurin-22-jit:
      path: /home/gitlab-runner/.asdf/installs/java
      executable: temurin-22.0.2+9/bin/java
      build:
        - /home/gitlab-runner/.asdf/bin/asdf install java temurin-22.0.2+9

    Java-Temurin-17-jit:
      path: /home/gitlab-runner/.asdf/installs/java/temurin-17.0.10+7/bin
      executable: java

    Java-Temurin-8-jit:
      path: /home/gitlab-runner/.asdf/installs/java/temurin-8.0.402+6/bin
      executable: java

    GraalVM-21-jit:
      path: /home/gitlab-runner/.asdf/installs/awfy/oracle-graalvm-21.0.2/bin
      executable: java

    CSOM-int:
        path: /home/gitlab-runner/.local
        executable: CSOM/CSOM
        args: " -H16 "
        build:
          - |
            export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            scripts/load_git_repo https://github.com/SOM-st/CSOM CSOM master
            cd CSOM
            make

    SOMpp-int:
        path: /home/gitlab-runner/.local
        executable: SOMpp/SOM++
        args: "-H16MB"
        build:
          - |+
            scripts/load_git_repo https://github.com/SOM-st/SOMpp SOMpp master
            cd SOMpp
            git clean -x -f -d
            git remote add somst https://github.com/SOM-st/SOMpp || true
            git remote add smarr https://github.com/smarr/SOMpp || true
            git fetch --all
            # git checkout -f -b master somst/master
            # git reset --hard somst/master
            git checkout --detach 284315707259e8072267ec6ac66dc27d7b0dcb05
            git submodule update --init --recursive

            export CC=clang-19
            export CXX=clang++-19
            export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            env
            cmake . -DCMAKE_BUILD_TYPE=Release -DUSE_TAGGING=true -DGC_TYPE=GENERATIONAL
            make -j

    SOM-RS-ast-int:
        path: /home/gitlab-runner/.local
        executable: somrs/target/release/som-interpreter-ast
        build:
          - |+
            set -x
            export PATH="/home/gitlab-runner/.cargo/bin:$PATH"
            BRANCH=master
            scripts/load_git_repo https://github.com/OctaveLarose/som-rs.git somrs $BRANCH
            cd somrs
            rustup update
            git remote add octave https://github.com/OctaveLarose/som-rs.git || true
            git fetch octave
            git checkout -f -b awfy-run octave/
            git reset --hard octave/$BRANCH
            git submodule update --init --recursive

            cargo build --release -p som-interpreter-ast

    SOM-RS-bc-int:
        path: /home/gitlab-runner/.local
        executable: somrs/target/release/som-interpreter-bc
        build:
          - |+
            set -x
            export PATH="/home/gitlab-runner/.cargo/bin:$PATH"
            BRANCH=master
            scripts/load_git_repo https://github.com/OctaveLarose/som-rs.git somrs $BRANCH
            cd somrs
            rustup update
            git remote add octave https://github.com/OctaveLarose/som-rs.git || true
            git fetch octave
            git checkout -f -b awfy-run octave/$BRANCH
            git reset --hard octave/$BRANCH
            git submodule update --init --recursive

            cargo build --release -p som-interpreter-bc

    ykSOM-int:
        path: /home/gitlab-runner/.local
        executable: yksom/target/release/yksom
        # build:
        #   - |
        #     cd yksom
        #
        #     export PATH="/home/gitlab-runner/.cargo/bin:$PATH"
        #     cargo clean
        #     cargo +alloy test --release
        #     cargo +alloy run  --release -- --cp SOM/Smalltalk SOM/TestSuite/TestHarness.som

        build:
          - |
            scripts/load_git_repo https://github.com/smarr/ykSOM yksom gha
            scripts/init_submodules yksom
            cd yksom

            export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            export PATH="/home/gitlab-runner/.cargo/bin:$PATH"
            rustup toolchain install nightly --allow-downgrade --component rustfmt
            cargo +nightly fmt --all -- --check

            # Build alloy
            if [ -d "alloy" ]
            then
              (cd alloy && git pull)
            else
              git clone https://github.com/softdevteam/alloy
            fi
            mkdir -p alloy/build/alloy
            (cd alloy && ./x.py build --stage 2 --config ../.buildbot.config.toml)

            rustup toolchain link alloy alloy/build/x86_64-unknown-linux-gnu/stage2

            cargo clean
            cargo +alloy test --release
            cargo +alloy run  --release -- --cp SOM/Smalltalk SOM/TestSuite/TestHarness.som

    TruffleSOM-ast-HotspotCE-jit-main:
        path: /home/gitlab-runner/.local/TruffleSOM
        executable: som
        args: -Dsom.interp=AST
        env:
          PATH: /usr/bin:/bin:/sbin:/home/gitlab-runner/.local/mx
        build:
          - |
            /home/gitlab-runner/.asdf/bin/asdf install java temurin-23.0.2+7
            export JAVA_HOME=/home/gitlab-runner/.asdf/installs/java/temurin-23.0.2+7
            SHA=182199257927581758dfef9a1bd69de166205207
            git fetch --all && git checkout -f $SHA && git submodule update -f --init --recursive
            ./som --setup latest-mx
            ./som --setup labsjdk
            mx sforceimport
            rm libs/jvmci || true
            ./som --setup labsjdk
            mx --env libgraal build
