# -*- mode: yaml -*-
# Config file for ReBench
default_experiment: all
default_data_file: 'benchmark.data'

.are_we_fast_yet:
    ## this is ignored by rebench
    iteration_numbers:
        fast_vm:      &FAST_VM      1000
        slow_vm:      &SLOW_VM      250
        slower_vm:    &SLOWER_VM    85
        very_slow_vm: &VERY_SLOW_VM 15
        impossibly_slow_vm: &IMPOSSIBLY_SLOW_VM 1

runs:
  max_invocation_time: 3600
  min_iteration_time: 10

reporting:
    rebenchdb:
        # this url needs to point to the API endpoint
        db_url: https://rebench.stefan-marr.de/rebenchdb
        repo_url: https://github.com/smarr/awfy-runs
        record_all: true # make sure everything is recorded
        project_name: Are We Fast Yet

# definition of benchmark suites
benchmark_suites:
    som-steady:
        gauge_adapter: RebenchLog
        command: " -cp .:Core:CD:DeltaBlue:Havlak:Json:NBody:Richards:/home/gitlab-runner/.local/TruffleSOM/Smalltalk Harness.som  %(benchmark)s %(iterations)s "
        iterations: *FAST_VM ## the number iterations measured
        location: awfy/benchmarks/SOM
        benchmarks: &BENCHMARKS
            - DeltaBlue:
                extra_args: 12000
                codespeed_name: "[peak] DeltaBlue"
            - Richards:
                extra_args: 30
                codespeed_name: "[peak] Richards"
            - Json:
                extra_args: 70
                codespeed_name: "[peak] Json"
            - CD:
                extra_args: 200
                codespeed_name: "[peak] CD"
            - Havlak:
                extra_args: 150
                codespeed_name: "[peak] Havlak"

            - Bounce:
                extra_args: 1500
                codespeed_name: "[peak] Bounce"
            - List:
                extra_args: 1500
                codespeed_name: "[peak] List"
            - Mandelbrot:
                extra_args: 500
                codespeed_name: "[peak] Mandelbrot"
            - NBody:
                extra_args: 250000
                codespeed_name: "[peak] NBody"
            - Permute:
                extra_args: 1000
                codespeed_name: "[peak] Permute"
            - Queens:
                extra_args: 1000
                codespeed_name: "[peak] Queens"
            - Sieve:
                extra_args: 3000
                codespeed_name: "[peak] Sieve"
            - Storage:
                extra_args: 500
                codespeed_name: "[peak] Storage"
            - Towers:
                extra_args: 600
                codespeed_name: "[peak] Towers"

    som-interp:
        gauge_adapter: RebenchLog
        command: " -cp .:Core:CD:DeltaBlue:Havlak:Json:NBody:Richards:/home/gitlab-runner/.local/TruffleSOM/Smalltalk Harness.som  %(benchmark)s %(iterations)s "
        iterations: *VERY_SLOW_VM ## the number iterations measured
        location: awfy/benchmarks/SOM
        benchmarks: *BENCHMARKS

    csom-interp:
        gauge_adapter: RebenchLog
        command: " -cp .:Core:CD:DeltaBlue:Havlak:Json:NBody:Richards:/home/gitlab-runner/.local/CSOM/Smalltalk Harness  %(benchmark)s %(iterations)s "
        iterations: *IMPOSSIBLY_SLOW_VM ## the number iterations measured
        location: awfy/benchmarks/SOM
        benchmarks: *BENCHMARKS

    sompp-interp:
        gauge_adapter: RebenchLog
        command: " -cp .:Core:CD:DeltaBlue:Havlak:Json:NBody:Richards:/home/gitlab-runner/.local/SOMpp/Smalltalk Harness  %(benchmark)s %(iterations)s "
        iterations: *VERY_SLOW_VM ## the number iterations measured
        location: awfy/benchmarks/SOM
        benchmarks: *BENCHMARKS

    somrs-interp:
        gauge_adapter: RebenchLog
        command: " -c . -c Core -c CD -c DeltaBlue -c Havlak -c Json -c NBody -c Richards -c /home/gitlab-runner/.local/somrs/core-lib/Smalltalk -- Harness  %(benchmark)s %(iterations)s "
        iterations: *IMPOSSIBLY_SLOW_VM ## the number iterations measured
        location: awfy/benchmarks/SOM
        benchmarks: *BENCHMARKS

    yksom-interp:
        gauge_adapter: RebenchLog
        command: " --cp .:Core:CD:DeltaBlue:Havlak:Json:NBody:Richards:/home/gitlab-runner/.local/yksom/SOM/Smalltalk Harness.som  %(benchmark)s %(iterations)s "
        iterations: *IMPOSSIBLY_SLOW_VM ## the number iterations measured
        location: awfy/benchmarks/SOM
        benchmarks: *BENCHMARKS


    java22-steady:
        gauge_adapter: RebenchLog
        location: awfy/benchmarks/Java
        command: " -cp benchmarks22.jar Harness %(benchmark)s %(iterations)s "
        iterations: *FAST_VM ## the number iterations measured
        benchmarks: *BENCHMARKS
        build:
          - |
            export JAVA_HOME=/home/gitlab-runner/.asdf/installs/java/temurin-22.0.2+9
            ant clean; ant jar
